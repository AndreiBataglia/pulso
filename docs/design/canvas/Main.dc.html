<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pulso A: cartões empilhados</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3CC6B5}a:hover{color:#7FE3D6}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 640px; box-sizing: border-box; background: #16181D; color: #E6EDF3; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; padding: 0 16px 16px; gap: 12px">
  <nav style="display: flex; align-items: center; gap: 4px; height: 48px; border-bottom: 1px solid #2B2F37">
    <button style="background: none; border: none; border-bottom: 2px solid #3CC6B5; color: #E6EDF3; font-size: 14px; font-weight: 600; padding: 12px 10px; margin-bottom: -1px">Pulso</button>
    <button style="background: none; border: none; color: #9198A1; font-size: 14px; padding: 12px 10px">Jogo</button>
    <button style="background: none; border: none; color: #9198A1; font-size: 14px; padding: 12px 10px">Cérebro</button>
    <div style="flex-grow: 1"></div>
    <button aria-label="Pausar sensores" style="width: 36px; height: 36px; border-radius: 8px; border: none; background: none; color: #9198A1; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path><path d="M10 9v6M14 9v6"></path></svg>
    </button>
    <button aria-label="Ajustes" style="width: 36px; height: 36px; border-radius: 8px; border: none; background: none; color: #9198A1; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
    </button>
  </nav>

  <div style="height: 196px; border-radius: 16px; background: #0E1014; position: relative; display: flex; align-items: center; justify-content: center; gap: 56px">
    <div style="width: 34px; height: 46px; border-radius: 17px; background: #7BD389"></div>
    <div style="width: 34px; height: 46px; border-radius: 17px; background: #7BD389"></div>
    <span style="position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #9198A1">contente</span>
  </div>

  <div style="background: #20232A; border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.45; color: #E6EDF3">Estamos no foco há 38 min. Às 10:00 eu te chamo para a pausa.</div>

  <section style="background: #20232A; border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px">
    <div style="display: flex; flex-direction: column; flex-grow: 1">
      <span style="font-size: 12px; color: #9198A1">Foco · 2 de 4</span>
      <span style="font-size: 34px; font-weight: 600; letter-spacing: 0.5px; font-variant-numeric: tabular-nums">21:42</span>
    </div>
    <button style="height: 44px; padding: 0 18px; border-radius: 10px; border: none; background: #3CC6B5; color: #0E1014; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>Pausar</button>
    <button aria-label="Pular fase" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #353A44; background: none; color: #9198A1; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l9 7-9 7z"></path><path d="M18 5v14"></path></svg>
    </button>
  </section>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button style="height: 64px; border-radius: 12px; border: 1px solid #2B2F37; background: #1B1E24; color: #E6EDF3; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F28C8C" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Carinho</button>
    <button style="height: 64px; border-radius: 12px; border: 1px solid #2B2F37; background: #1B1E24; color: #E6EDF3; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7FD1FF" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12l-1.5 16h-9z"></path><path d="M7 10h10"></path></svg>Bebi água</button>
    <button style="height: 64px; border-radius: 12px; border: 1px solid #2B2F37; background: #1B1E24; color: #E6EDF3; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B59CE6" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"></path><path d="M16 11h2a2 2 0 0 1 0 4h-2"></path></svg>Pausa agora</button>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9198A1">
    <span>4 copos hoje</span><span>2 focos completos</span>
  </div>
</div>
</x-dc>

</body>
</html>
